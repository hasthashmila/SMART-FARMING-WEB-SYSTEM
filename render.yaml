services:
  - type: web
    name: smart-farming-web-system
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/agripulse-data
      - key: SECURE_COOKIES
        value: "true"
